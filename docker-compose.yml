services:
  ingest:
    build: ./ingest
    ports:
      # Published on every interface. Docker's rules sit ahead of the INPUT
      # chain, so `ufw deny 9585` does NOT block this — bind an explicit
      # address instead, e.g. "192.168.1.50:9585:8000". See docs/security.md.
      - "9585:8000"
    environment:
      - INGEST_AUTH_TOKEN=${INGEST_AUTH_TOKEN:-}
      # Ingest refuses to start with no token unless this is explicitly set,
      # so a missing .env fails loudly instead of coming up wide open.
      - INGEST_ALLOW_ANONYMOUS=${INGEST_ALLOW_ANONYMOUS:-}
      # Minutes a session may go quiet before it stops counting as active.
      # Also the grace period before an unused session is purged.
      - ACTIVE_WINDOW_MINUTES=${ACTIVE_WINDOW_MINUTES:-15}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # ── Backup (all optional) ──────────────────────────────────────────
      # Local/mounted path:   BACKUP_DESTINATION=/backups
      # rsync over SSH:       BACKUP_DESTINATION=user@nas:/volume1/claude-backups/
      - BACKUP_DESTINATION=${BACKUP_DESTINATION:-}
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-24}
      - BACKUP_KEEP=${BACKUP_KEEP:-7}
      # Path to SSH private key inside the container (mount it via volumes below)
      - BACKUP_SSH_KEY=${BACKUP_SSH_KEY:-}
    # Hardening that cannot break a bind mount. Running as a non-root user is
    # the bigger win but needs the host-side ownership of ./usage-data to match
    # — see docs/deployment.md before enabling it:
    #   user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 200
    volumes:
      - ./usage-data:/data
      # Uncomment and adjust if using rsync-over-SSH backup:
      # - /home/youruser/.ssh/id_ed25519:/run/secrets/backup_key:ro
      # Then set BACKUP_SSH_KEY=/run/secrets/backup_key
      #
      # Uncomment if backing up to a locally mounted NAS path:
      # - /mnt/nas/claude-backups:/backups
      # Then set BACKUP_DESTINATION=/backups
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    ports:
      - "9595:80"
    environment:
      - INGEST_AUTH_TOKEN=${INGEST_AUTH_TOKEN:-}
    depends_on:
      ingest:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    restart: unless-stopped

